name: BlastRadius Selective CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  compute-scope:
    name: 💥 Compute Blast Radius
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.blast.outputs.services }}
      has_affected: ${{ steps.blast.outputs.has_affected }}
      affected_count: ${{ steps.blast.outputs.affected_count }}
      skipped_count: ${{ steps.blast.outputs.skipped_count }}
      pct_saved: ${{ steps.blast.outputs.pct_saved }}
    steps:
      - name: Checkout Code with Full Git History
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Monorepo Dependencies
        run: npm ci || npm install

      - name: Build Dependency Graph
        run: node build-graph.js

      - name: Calculate Blast Radius
        id: blast
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_REF="origin/${{ github.base_ref }}"
            HEAD_REF="origin/${{ github.head_ref }}"
            echo "Running git diff against PR base: $BASE_REF ... $HEAD_REF"
            node compute-blast-radius.js --base "$BASE_REF" --head "$HEAD_REF"
          else
            echo "Running git diff for push event (HEAD~1 ... HEAD)"
            node compute-blast-radius.js --base HEAD~1 --head HEAD
          fi

          node record-metrics.js

          AFFECTED_JSON=$(node -e "const d=require('./blast-radius.json'); console.log(JSON.stringify(d.affectedServices));")
          AFFECTED_COUNT=$(node -e "const d=require('./blast-radius.json'); console.log(d.metrics.affectedCount);")
          SKIPPED_COUNT=$(node -e "const d=require('./blast-radius.json'); console.log(d.metrics.skippedCount);")
          PCT_SAVED=$(node -e "const d=require('./blast-radius.json'); console.log(d.metrics.percentSaved);")

          echo "services=$AFFECTED_JSON" >> $GITHUB_OUTPUT
          echo "affected_count=$AFFECTED_COUNT" >> $GITHUB_OUTPUT
          echo "skipped_count=$SKIPPED_COUNT" >> $GITHUB_OUTPUT
          echo "pct_saved=$PCT_SAVED" >> $GITHUB_OUTPUT

          if [ "$AFFECTED_COUNT" -gt 0 ]; then
            echo "has_affected=true" >> $GITHUB_OUTPUT
          else
            echo "has_affected=false" >> $GITHUB_OUTPUT
          fi

      - name: Upload Blast Radius Artifacts & Dashboard
        uses: actions/upload-artifact@v4
        with:
          name: blast-radius-report
          path: |
            dependency-graph.json
            blast-radius.json
            metrics-history.json
            dashboard/

      - name: Post PR Summary Comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const blast = JSON.parse(fs.readFileSync('blast-radius.json', 'utf-8'));
            const history = fs.existsSync('metrics-history.json')
              ? JSON.parse(fs.readFileSync('metrics-history.json', 'utf-8'))
              : null;

            const affectedList = blast.affectedServices.length > 0
              ? blast.affectedServices.map(s => {
                  const reason = blast.explanations[s] || 'Direct/Transitive change';
                  return `| \`${s}\` | 🔴 **TEST** | ${reason} |`;
                }).join('\n')
              : '| _None_ | 🟢 **CLEAN** | No services affected by this change |';

            const skippedList = blast.skippedServices.length > 0
              ? blast.skippedServices.map(s => `| \`${s}\` | ⚪ **SKIPPED** | Untouched in dependency graph |`).join('\n')
              : '| _None_ | - | All services required testing |';

            const cumulativeMins = history ? history.summary.cumulativeMinutesSaved : blast.metrics.estimatedTimeSavedMinutes;

            const body = `## 💥 BlastRadius: Selective Monorepo CI Report

            ### ⏱️ Summary: **${blast.metrics.skippedCount}/${blast.totalServices} Services Skipped (~${blast.metrics.percentSaved}% CI Compute Saved)**

            | Metric | Value |
            | :--- | :--- |
            | 🎯 **Directly Changed** | \`${blast.changedServices.join('`, `') || 'none'}\` |
            | ⚡ **Total Services to Test** | **${blast.metrics.affectedCount}** of ${blast.totalServices} |
            | 🛡️ **Services Skipped** | **${blast.metrics.skippedCount}** of ${blast.totalServices} |
            | ⏳ **Estimated Time Saved (This Run)** | **~${blast.metrics.estimatedTimeSavedMinutes} minutes** |
            | 📈 **Cumulative CI Time Saved** | **~${cumulativeMins} minutes** |

            ---

            ### 🔍 Impact Breakdown

            #### Services Targeted for Build & Test
            | Service | Status | Reason & Dependency Trail |
            | :--- | :---: | :--- |
            ${affectedList}

            #### Services Safely Skipped
            | Service | Status | Reason |
            | :--- | :---: | :--- |
            ${skippedList}

            > 📊 *Interactive visual graph report uploaded as artifact \`blast-radius-report\`.*
            `;

            // Look for existing comment to update or create new one
            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.data.find(c =>
              c.body.includes('💥 BlastRadius: Selective Monorepo CI Report')
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body
              });
            }

  test-affected:
    name: 🧪 Test [${{ matrix.service }}]
    needs: compute-scope
    if: needs.compute-scope.outputs.has_affected == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.compute-scope.outputs.services) }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Build Docker Container for ${{ matrix.service }}
        run: |
          echo "Building Docker container for service: ${{ matrix.service }}"
          docker build -t blastradius-${{ matrix.service }}:latest -f services/${{ matrix.service }}/Dockerfile .

      - name: Execute Tests Inside Docker Container
        run: |
          echo "Running isolated tests in container for: ${{ matrix.service }}"
          docker run --rm blastradius-${{ matrix.service }}:latest

      - name: Fallback Local Verification
        if: failure()
        run: |
          echo "Container test failed. Running local fallback diagnostics..."
          node --test services/${{ matrix.service }}/test/*.test.js
