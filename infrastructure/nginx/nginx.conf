events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct="$upstream_connect_time" uht="$upstream_header_time" urt="$upstream_response_time" '
                    'upstream=$upstream_addr served_by=$upstream_http_x_served_by';

    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    upstream api_cluster {
        # Round-robin load balancing with passive failure detection
        server api-1:4000 max_fails=2 fail_timeout=5s;
        server api-2:4000 max_fails=2 fail_timeout=5s;
        server api-3:4000 max_fails=2 fail_timeout=5s;
    }

    server {
        listen 80;
        server_name localhost;

        # Health check for NGINX load balancer itself
        location /healthz {
            access_log off;
            add_header Content-Type application/json;
            return 200 '{"status":"ok","component":"nginx","timestamp":"$time_iso8601"}';
        }

        # Stub status for Prometheus metrics scraping
        location /stub_status {
            stub_status;
            access_log off;
            allow all;
        }

        # Reverse proxy to API cluster
        location / {
            proxy_pass http://api_cluster;

            # Failover behavior: retry next upstream on connection error or 5xx
            proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
            proxy_next_upstream_tries 3;
            proxy_next_upstream_timeout 5s;
            proxy_connect_timeout 2s;
            proxy_read_timeout 5s;
            proxy_send_timeout 5s;

            # Forward standard headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;

            # Ensure upstream served identity header is returned to client
            proxy_pass_header X-Served-By;
            add_header X-Load-Balancer "nginx-open-source" always;
        }
    }
}
