services:
  # ============================================================================
  # REDIS DISTRIBUTED CACHE
  # ============================================================================
  redis:
    image: redis:7-alpine
    container_name: blastradius-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    networks:
      - blastradius_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 3s

  # ============================================================================
  # EXPLICIT API REPLICAS (Fixed instance_id for deterministic tracking)
  # ============================================================================
  api-1:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    container_name: blastradius-api-1
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - API_PORT=4000
      - INSTANCE_ID=api-1
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REPORT_API_SECRET=${REPORT_API_SECRET:-blastradius_report_secret_default_9f8e7d}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-*}
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - blastradius_net
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:4000/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  api-2:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    container_name: blastradius-api-2
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - API_PORT=4000
      - INSTANCE_ID=api-2
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REPORT_API_SECRET=${REPORT_API_SECRET:-blastradius_report_secret_default_9f8e7d}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-*}
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - blastradius_net
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:4000/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  api-3:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    container_name: blastradius-api-3
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - API_PORT=4000
      - INSTANCE_ID=api-3
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REPORT_API_SECRET=${REPORT_API_SECRET:-blastradius_report_secret_default_9f8e7d}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-*}
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - blastradius_net
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:4000/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  # ============================================================================
  # NGINX REVERSE PROXY & LOAD BALANCER
  # ============================================================================
  nginx:
    image: nginx:alpine
    container_name: blastradius-nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      api-1:
        condition: service_healthy
      api-2:
        condition: service_healthy
      api-3:
        condition: service_healthy
    networks:
      - blastradius_net
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:80/healthz || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 3s

  # ============================================================================
  # PROMETHEUS TIME-SERIES MONITORING
  # ============================================================================
  prometheus:
    image: prom/prometheus:latest
    container_name: blastradius-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./infrastructure/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    networks:
      - blastradius_net
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:9090/-/healthy || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  # ============================================================================
  # GRAFANA METRICS VISUALIZATION DASHBOARDS
  # ============================================================================
  grafana:
    image: grafana/grafana:latest
    container_name: blastradius-grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./infrastructure/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./infrastructure/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./infrastructure/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - blastradius_net

networks:
  blastradius_net:
    driver: bridge

volumes:
  redis_data:
  prometheus_data:
  grafana_data:
